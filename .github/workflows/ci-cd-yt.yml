name: CI-CD Pipeline

on:
    push:
        branches: 
            - main
            - 'feature/*'
    pull_request:
        branches:
            - main
    workflow_dispatch:

jobs: 
    build-and-push-images:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v4
            
            - name: Get_changed_files
              id: changed-files-build
              uses: tj-actions/changed-files@v45
              with:
                files: |
                    Dockerfile
                    requirements.txt
                        
            - name: Set up Docker Buildx
              if: steps.changed-files-build.outputs.any_changed == 'true'
              uses: docker/setup-buildx-action@v3

            - name: Log in to Docker Hub
              if: steps.changed-files-build.outputs.any_changed == 'true'
              uses: docker/login-action@v3
              with:
                  username: ${{ vars.DOCKERHUB_USERNAME }}
                  password: ${{ secrets.DOCKERHUB_PASSWORD }}

            - name: Build and push Docker image
              if: steps.changed-files-build.outputs.any_changed == 'true'
              run: |
                docker buildx build --push \
                  --tag ${{ vars.DOCKERHUB_USERNAME }}/${{ vars.DOCKERHUB_REPOSITORY }}:latest \
                  --tag ${{ vars.DOCKERHUB_USERNAME }}/${{ vars.DOCKERHUB_REPOSITORY }}:${{ github.sha }} \
                  .


    unit-and-integration-and-e2e-tests:
      runs-on: ubuntu-latest
      needs: build-and-push-images
      env: 
        AIRFLOW_WWW_USER_PASSWORD: ${{ secrets.AIRFLOW_WWW_USER_PASSWORD }}
        AIRFLOW_WWW_USER_USERNAME: ${{ secrets.AIRFLOW_WWW_USER_USERNAME }}
        API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        CELERY_BACKEND_NAME: ${{ vars.CELERY_BACKEND_NAME }}
        CELERY_BACKEND_PASSWORD: ${{ secrets.CELERY_BACKEND_PASSWORD }}
        CELERY_BACKEND_USERNAME: ${{ vars.CELERY_BACKEND_USERNAME }}
        ELT_DATABASE_NAME: ${{ vars.ELT_DATABASE_NAME }}
        ELT_DATABASE_PASSWORD: ${{ secrets.ELT_DATABASE_PASSWORD }}
        ELT_DATABASE_USERNAME: ${{ vars.ELT_DATABASE_USERNAME }}
        FERNET_KEY: ${{ secrets.FERNET_KEY }}
        AIRFLOW_JWT_SECRET: ${{ secrets.AIRFLOW_JWT_SECRET }}
        METADATA_DATABASE_NAME: ${{ vars.METADATA_DATABASE_NAME }}
        METADATA_DATABASE_PASSWORD: ${{ secrets.METADATA_DATABASE_PASSWORD }}
        METADATA_DATABASE_USERNAME: ${{ vars.METADATA_DATABASE_USERNAME }}
        POSTGRES_USER: ${{ vars.POSTGRES_CONN_USERNAME }}
        POSTGRES_PASSWORD: ${{ secrets.POSTGRES_CONN_PASSWORD }}
        POSTGRES_CONN_HOST: ${{ vars.POSTGRES_CONN_HOST }}
        POSTGRES_CONN_PASSWORD: ${{ secrets.POSTGRES_CONN_PASSWORD }}
        POSTGRES_CONN_PORT: ${{ secrets.POSTGRES_CONN_PORT }}
        POSTGRES_CONN_USERNAME: ${{ secrets.POSTGRES_CONN_USERNAME }}
        AIRFLOW_UID: ${{ vars.AIRFLOW_UID }}
        CHANNEL_HANDLE: ${{ vars.YOUTUBE_CHANNEL_HANDLE }}
        DOCKERHUB_NAMESPACE: ${{ vars.DOCKERHUB_NAMESPACE }}
        DOCKERHUB_REPOSITORY: ${{ vars.DOCKERHUB_REPOSITORY }}
        DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
    
      steps:
        - name: Checkout code
          uses: actions/checkout@v4
        - name: Get_changed_files
          id: changed-files-tests
          uses: tj-actions/changed-files@v45
          with:
            files: |
                dags/**
                include/**
                docker-compose.yaml

        - name: Setup up docker compose
          if: steps.changed-files-tests.outputs.any_changed == 'true'
          run: docker compose up -d
        - name: Run Unit and Integration tests
          if: steps.changed-files-tests.outputs.any_changed == 'true'
          run: docker exec -t airflow-worker sh -c "pytest tests/ -v"
        - name: Run End-to-End tests
          if: steps.changed-files-tests.outputs.any_changed == 'true'
          run: |
            DAG_NAMES=("fetch_yt_data_extract" "yt_load_to_postgres" "yt_data_quality_check")
            for DAG in "${DAG_NAMES[@]}"; do 
              docker exec -t airflow-worker sh -c "airflow dags test $DAG"
            done
        - name: Tear down docker compose
          if: steps.changed-files-tests.outputs.any_changed == 'true'
          run: docker compose down